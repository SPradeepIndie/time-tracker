name: CI Orchestrator

on:
  push:
    branches:
      - main
      - pipeline
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -v ./...

      - name: Build Go Binaries (API & Migrate)
        run: |
          mkdir -p bin
          go build -v -o bin/api ./api/cmd
          go build -v -o bin/migrate ./migrate/cmd

  mobile-ci:
    name: Mobile CI (Expo / React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Dry-run Expo Android bundle export
        run: npx expo export --platform android --no-bytecode --dump-sourcemap=false
